[tox]
envlist =
    py{310,311,312,313}-django52
    py{312,313}-django60
    py{312,313}-djangoupstream
    py313-drfupstream
    black

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    djangoupstream: https://github.com/django/django/archive/main.tar.gz

    drfupstream: Django>=5.2,<6.0
    drfupstream: https://github.com/encode/django-rest-framework/archive/master.tar.gz
    django52: djangorestframework~=3.16.0
    django60: djangorestframework~=3.16.0
    djangoupstream: https://github.com/encode/django-rest-framework/archive/master.tar.gz
commands =
    {envbindir}/django-admin check --pythonpath=. --settings=tests.settings
    {envbindir}/django-admin test --pythonpath=. --settings=tests.settings {posargs}

[testenv:black]
basepython = python3
skip_install = true
deps =
    black>=19.10b0
commands =
    black --check --diff ordered_model/ tests/


[flake8]
max-line-length = 100
